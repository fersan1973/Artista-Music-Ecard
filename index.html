
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fernando Sánchez Flores - Artista Music</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    .card-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      line-height: 0;
    }
    .card-bg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 26px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
    }
    .touch-target {
      position: absolute;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Zona del teléfono */
    .link-phone {
      left: 14%;
      top: 67%;
      width: 72%;
      height: 6%;
    }
    /* Zona del correo */
    .link-email {
      left: 14%;
      top: 73%;
      width: 72%;
      height: 5.5%;
    }
    /* Zona de la dirección (Google Maps) */
    .link-maps {
      left: 14%;
      top: 78.5%;
      width: 72%;
      height: 6%;
    }
    /* Botón CALL DIRECT */
    .btn-call {
      left: 7.5%;
      bottom: 6.8%;
      width: 41%;
      height: 6.5%;
      border-radius: 12px;
    }
    /* Botón SEND EMAIL */
    .btn-send {
      right: 7.5%;
      bottom: 6.8%;
      width: 41%;
      height: 6.5%;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Carga tu imagen nueva tal como la subiste -->
    <img src="IMG-20261009-WA0031.jpg" alt="Fernando Sánchez Flores E-Card" class="card-bg">

    <!-- Botones táctiles interactivos encima de la imagen -->
    <a href="tel:2103850515" class="touch-target link-phone" title="Llamar"></a>
    <a href="mailto:fersan17@gmail.com" class="touch-target link-email" title="Enviar correo"></a>
    <a href="https://maps.google.com/?q=3106+West+Ave,+San+Antonio,+TX+78213" target="_blank" class="touch-target link-maps" title="Abrir ubicación"></a>

    <a href="tel:2103850515" class="touch-target btn-call" title="Call Direct"></a>
    <a href="mailto:fersan17@gmail.com" class="touch-target btn-send" title="Send Email"></a>
  </div>

</body>
</html>
